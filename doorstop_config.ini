; Doorstop 4.5 configuration for dc_loader
; Place this file alongside winhttp.dll and DataCenter.exe in the game root.
; Linux/Proton: add launch option: DOTNET_ROOT="" WINEDLLOVERRIDES="winhttp=n,b" %command%

[General]
enabled=true
target_assembly=loader/dc_loader.dll
redirect_output_log=false
boot_config_override=
ignore_disable_switch=false

[UnityMono]
; Not used for IL2CPP games

[Il2Cpp]
coreclr_path=dotnet/coreclr.dll
corlib_dir=dotnet
